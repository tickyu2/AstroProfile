# Firebase Data Connect Configuration
# GENESIS Phase 3 - Memory Architecture (PostgreSQL Scaling)
#
# This enables scaling to PostgreSQL when Firestore vector search
# becomes limiting (>10K memories per user).
#
# Setup:
# 1. firebase init dataconnect
# 2. Link to Cloud SQL for PostgreSQL instance
# 3. Enable pgvector extension: CREATE EXTENSION IF NOT EXISTS vector;
# 4. Run: firebase deploy --only dataconnect

specVersion: "v1alpha"
serviceId: "genesis-memory"
location: "us-central1"

schema:
  source: "./schema"

connectorDirs:
  - "./connector"
