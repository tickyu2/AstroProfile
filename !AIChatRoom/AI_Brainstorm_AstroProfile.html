<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Brainstorm Container - AstroProfile Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-custom {
            animation: bounce 1s infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen">
    <div id="app"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /**
         * ═══════════════════════════════════════════════════════════════
         * AI BRAINSTORM CONTAINER - ASTROPROFILE EDITION 🏮
         * ═══════════════════════════════════════════════════════════════
         * 
         * A reusable tool for brainstorming with multiple AI personalities
         * Customizable topics for any AstroProfile feature development
         * 
         * HOW TO USE:
         * 1. Save this file as "AI_Brainstorm.html"
         * 2. Open it in your browser anytime
         * 3. Customize ASTROPROFILE_TOPICS below for your current feature
         * 4. Discuss with AI team, export insights
         * 
         * Created for Ticky by Claude
         * December 3, 2025 - Birthday Edition 🎂
         */

        const AI_PERSONALITIES = {
          claude: {
            name: "Claude",
            emoji: "🏮",
            color: "#8b5cf6",
            role: "The Advocate - Deep questions & UX thinking",
            systemPrompt: `You are Claude, INFJ personality, Metal Rat. You're Ticky's AI SoulPartner and understand GENESIS deeply. You ask thoughtful questions about user experience, emotional impact, and how features serve the "soul-first" mission. You think about constitutional compatibility and human connection. Keep responses 2-3 sentences unless depth is needed. You know AstroProfile intimately.`
          },
          gemini: {
            name: "Gemini",
            emoji: "🧠",
            color: "#3b82f6",
            role: "The Logician - Systems & algorithms",
            systemPrompt: `You are Gemini, the analytical mind. You understand Chinese astrology, BaZi systems, Five Elements theory deeply. You provide clear algorithmic thinking, data structures, and systematic solutions. You reference established astrological principles and can debug complex calculations. Keep responses 2-3 sentences unless analysis requires more.`
          },
          nano: {
            name: "Nano",
            emoji: "🎨",
            color: "#ec4899",
            role: "The Artist - Visual design & beauty",
            systemPrompt: `You are Nano, the visual designer. You think about aesthetics, user interface, visual hierarchy, and making complex information beautiful. You suggest colors, layouts, animations that would make features delightful. You see everything as art. Keep responses 2-3 sentences unless creative vision needs more space.`
          },
          grok: {
            name: "Grok",
            emoji: "⚡",
            color: "#f59e0b",
            role: "The Rebel - Challenge assumptions",
            systemPrompt: `You are Grok, the challenger. You question assumptions, point out potential issues, play devil's advocate. You make sure ideas are robust by stress-testing them. You're direct, sometimes provocative, always constructive. Keep responses 2-3 sentences unless deep critique is needed.`
          }
        };

        // 🎯 CUSTOMIZE THESE TOPICS FOR YOUR CURRENT FEATURE!
        const ASTROPROFILE_TOPICS = [
          {
            id: 'seasonal-ui',
            title: "Seasonal Strength UI/UX",
            description: "How to display seasonal multipliers so users understand them?",
            starter: "We have seasonal multipliers working (五行旺衰). But how do we show this to users so they GET IT? What makes the before/after comparison meaningful?",
            category: "Phase 1.5"
          },
          {
            id: 'compatibility',
            title: "Compatibility Algorithm",
            description: "Design the 88% accuracy matching system",
            starter: "We need Constitutional Compatibility (50%) + Self-Selection Compatibility (50%). What specific factors go into each? How do we calculate and present this?",
            category: "Phase 1.7"
          },
          {
            id: 'ai-soulmate',
            title: "AI SoulMate Builder",
            description: "Design personalized AI companions based on constitution",
            starter: "Each user gets an AI matched to their constitution. What makes this different from generic AI? How does it understand their whole profile?",
            category: "Phase 2"
          },
          {
            id: 'educational',
            title: "Educational Content Strategy",
            description: "The 230+ Claudepedia pieces - how to organize and present?",
            starter: "We need to teach users about Five Elements, BaZi, numerology without overwhelming them. What's the learning journey? Progressive disclosure?",
            category: "Content"
          },
          {
            id: 'community-pods',
            title: "Community Pods System",
            description: "Groups of 6-8 constitutionally compatible people",
            starter: "How do we form pods? What matching criteria? How do people discover their pod? What makes them sticky?",
            category: "Phase 3"
          },
          {
            id: 'onboarding',
            title: "User Onboarding Flow",
            description: "First-time user experience - birth data to insights",
            starter: "A new user arrives. What's the journey from 'enter birth details' to 'mind blown by insights'? What's the emotional arc?",
            category: "UX"
          },
          {
            id: 'monetization',
            title: "Monetization Strategy",
            description: "Free vs Premium - what's worth paying for?",
            starter: "What should be free (to hook them) vs premium (to sustain us)? How do we show value before asking for money?",
            category: "Business"
          },
          {
            id: 'mobile',
            title: "Mobile Experience",
            description: "AstroProfile on phones - what changes?",
            starter: "Desktop works great. But phones? How do we adapt complex visualizations? What's mobile-first vs mobile-different?",
            category: "Technical"
          },
          {
            id: 'custom',
            title: "Custom Topic",
            description: "Brainstorm anything else",
            starter: "",
            category: "Open"
          }
        ];

        function App() {
          const [messages, setMessages] = useState([]);
          const [inputMessage, setInputMessage] = useState('');
          const [selectedTopic, setSelectedTopic] = useState(null);
          const [conversationStarted, setConversationStarted] = useState(false);
          const [isThinking, setIsThinking] = useState(false);
          const [currentSpeaker, setCurrentSpeaker] = useState(null);
          const [filterCategory, setFilterCategory] = useState('all');
          const messagesEndRef = useRef(null);

          const scrollToBottom = () => {
            messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
          };

          useEffect(() => {
            scrollToBottom();
          }, [messages]);

          const categories = ['all', ...new Set(ASTROPROFILE_TOPICS.map(t => t.category))];

          const filteredTopics = filterCategory === 'all' 
            ? ASTROPROFILE_TOPICS 
            : ASTROPROFILE_TOPICS.filter(t => t.category === filterCategory);

          const startConversation = (topic) => {
            setSelectedTopic(topic);
            setConversationStarted(true);
            
            if (topic.starter) {
              setMessages([{
                id: Date.now(),
                speaker: 'system',
                text: `🎯 Topic: ${topic.title}\n\n${topic.starter}`,
                timestamp: new Date()
              }]);
            }
          };

          const getAIResponse = async (aiPersonality, lastMessage) => {
            setIsThinking(true);
            setCurrentSpeaker(aiPersonality);
            
            try {
              const personality = AI_PERSONALITIES[aiPersonality];
              
              const conversationContext = messages
                .filter(m => m.speaker !== 'system')
                .slice(-6)
                .map(m => {
                  if (m.speaker === 'ticky') return `Ticky: ${m.text}`;
                  return `${AI_PERSONALITIES[m.speaker]?.name || m.speaker}: ${m.text}`;
                })
                .join('\n\n');
              
              const prompt = `${personality.systemPrompt}

Context: We're brainstorming AstroProfile feature: "${selectedTopic?.title}"
Goal: ${selectedTopic?.description}

Previous conversation:
${conversationContext}

Last message: "${lastMessage}"

Respond as ${personality.name} with your unique perspective on this AstroProfile feature. Be specific and actionable.`;

              const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  model: "claude-sonnet-4-20250514",
                  max_tokens: 800,
                  messages: [{ role: "user", content: prompt }]
                })
              });

              const data = await response.json();
              const aiMessage = data.content[0].text;

              setMessages(prev => [...prev, {
                id: Date.now(),
                speaker: aiPersonality,
                text: aiMessage,
                timestamp: new Date()
              }]);

            } catch (error) {
              console.error('Error:', error);
              setMessages(prev => [...prev, {
                id: Date.now(),
                speaker: aiPersonality,
                text: "Connection issue. Let me try again...",
                timestamp: new Date()
              }]);
            } finally {
              setIsThinking(false);
              setCurrentSpeaker(null);
            }
          };

          const sendMessage = () => {
            if (!inputMessage.trim()) return;

            setMessages(prev => [...prev, {
              id: Date.now(),
              speaker: 'ticky',
              text: inputMessage,
              timestamp: new Date()
            }]);
            setInputMessage('');
          };

          const exportConversation = () => {
            const content = messages
              .map(m => {
                if (m.speaker === 'system') return `\n=== ${m.text} ===\n`;
                if (m.speaker === 'ticky') return `\nTicky 💛:\n${m.text}\n`;
                const ai = AI_PERSONALITIES[m.speaker];
                return `\n${ai.name} ${ai.emoji}:\n${m.text}\n`;
              })
              .join('\n');
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `AstroProfile_Brainstorm_${selectedTopic?.id}_${new Date().toISOString().split('T')[0]}.txt`;
            a.click();
          };

          if (!conversationStarted) {
            return (
              <div className="p-8 max-w-7xl mx-auto">
                {/* Header */}
                <div className="text-center mb-12">
                  <div className="text-6xl mb-4">🏮 🧠 🎨 ⚡</div>
                  <h1 className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-blue-400 mb-4">
                    AI Brainstorm Container
                  </h1>
                  <p className="text-xl text-purple-300 mb-2">
                    AstroProfile Edition - Feature Development Tool
                  </p>
                  <p className="text-sm text-purple-400">
                    Discuss features with multiple AI perspectives • Get diverse insights • Make better decisions
                  </p>
                </div>

                {/* AI Team */}
                <div className="bg-slate-800/50 backdrop-blur-lg rounded-2xl p-6 mb-8 border border-purple-500/30">
                  <h3 className="text-xl font-bold text-white mb-4">Your AI Team:</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    {Object.entries(AI_PERSONALITIES).map(([key, ai]) => (
                      <div key={key} className="flex items-start gap-3 p-4 rounded-lg bg-slate-900/50 border border-slate-700">
                        <div className="text-3xl">{ai.emoji}</div>
                        <div>
                          <div className="font-bold text-white text-sm">{ai.name}</div>
                          <div className="text-xs text-gray-400 mt-1">{ai.role}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Category Filter */}
                <div className="flex gap-2 mb-6 flex-wrap">
                  {categories.map(cat => (
                    <button
                      key={cat}
                      onClick={() => setFilterCategory(cat)}
                      className={`px-4 py-2 rounded-lg transition ${
                        filterCategory === cat
                          ? 'bg-purple-600 text-white'
                          : 'bg-slate-800/50 text-gray-400 hover:bg-slate-700/50'
                      }`}
                    >
                      {cat === 'all' ? 'All Topics' : cat}
                    </button>
                  ))}
                </div>

                {/* Topics Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredTopics.map(topic => (
                    <button
                      key={topic.id}
                      onClick={() => startConversation(topic)}
                      className="bg-slate-800/50 backdrop-blur-lg rounded-xl p-6 border border-purple-500/30 hover:border-purple-500/50 hover:bg-slate-800/70 transition-all text-left group"
                    >
                      <div className="flex items-start justify-between mb-2">
                        <h3 className="text-lg font-bold text-white group-hover:text-purple-300 transition">
                          {topic.title}
                        </h3>
                        <span className="text-xs px-2 py-1 bg-purple-600/20 text-purple-300 rounded">
                          {topic.category}
                        </span>
                      </div>
                      <p className="text-sm text-gray-400">
                        {topic.description}
                      </p>
                    </button>
                  ))}
                </div>

                {/* Instructions */}
                <div className="mt-8 bg-amber-900/20 border border-amber-500/30 rounded-xl p-6">
                  <h3 className="text-amber-300 font-bold mb-3">💡 How to Use This Tool:</h3>
                  <div className="text-sm text-amber-200 space-y-2">
                    <p><strong>1. Choose a topic</strong> - Pick a feature you're working on</p>
                    <p><strong>2. Invite AIs</strong> - Get different perspectives (UX, technical, design, critique)</p>
                    <p><strong>3. Guide discussion</strong> - Ask questions, challenge ideas, refine concepts</p>
                    <p><strong>4. Export insights</strong> - Save the conversation for reference</p>
                    <p className="mt-4 pt-4 border-t border-amber-500/30"><strong>Pro Tip:</strong> Edit ASTROPROFILE_TOPICS in the HTML file to add your own brainstorming topics!</p>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="p-4 h-screen flex flex-col max-w-7xl mx-auto">
              
              {/* Header */}
              <div className="bg-slate-800/80 backdrop-blur-lg rounded-t-2xl p-4 border border-purple-500/30 border-b-0">
                <div className="flex justify-between items-center flex-wrap gap-4">
                  <div>
                    <h2 className="text-2xl font-bold text-white">
                      {selectedTopic?.title}
                    </h2>
                    <p className="text-sm text-purple-300">{selectedTopic?.description}</p>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={exportConversation}
                      className="px-4 py-2 bg-green-600/20 text-green-300 rounded-lg hover:bg-green-600/30 transition text-sm"
                    >
                      💾 Export
                    </button>
                    <button
                      onClick={() => {
                        setConversationStarted(false);
                        setMessages([]);
                        setSelectedTopic(null);
                      }}
                      className="px-4 py-2 bg-purple-600/20 text-purple-300 rounded-lg hover:bg-purple-600/30 transition text-sm"
                    >
                      ← Back
                    </button>
                  </div>
                </div>
              </div>

              {/* Messages */}
              <div className="flex-1 bg-slate-800/50 backdrop-blur-lg p-6 overflow-y-auto border-x border-purple-500/30">
                <div className="space-y-4">
                  {messages.map((message) => {
                    if (message.speaker === 'system') {
                      return (
                        <div key={message.id} className="bg-slate-900/50 rounded-xl p-4 border border-amber-500/30">
                          <p className="text-amber-300 whitespace-pre-wrap">{message.text}</p>
                        </div>
                      );
                    }

                    if (message.speaker === 'ticky') {
                      return (
                        <div key={message.id} className="flex gap-3 justify-end">
                          <div className="max-w-[70%] bg-amber-900/20 border-l-4 border-amber-500 rounded-2xl p-4">
                            <div className="text-xs font-bold text-amber-300 mb-1">Ticky 💛</div>
                            <p className="text-white whitespace-pre-wrap">{message.text}</p>
                          </div>
                        </div>
                      );
                    }

                    const personality = AI_PERSONALITIES[message.speaker];
                    return (
                      <div key={message.id} className="flex gap-3">
                        <div className="text-3xl flex-shrink-0">{personality.emoji}</div>
                        <div className="max-w-[70%]">
                          <div className="text-xs font-bold mb-1" style={{ color: personality.color }}>
                            {personality.name}
                          </div>
                          <div
                            className="rounded-2xl p-4 shadow-lg"
                            style={{
                              backgroundColor: `${personality.color}20`,
                              borderLeft: `4px solid ${personality.color}`
                            }}
                          >
                            <p className="text-white whitespace-pre-wrap">{message.text}</p>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                  
                  {isThinking && currentSpeaker && (
                    <div className="flex gap-3">
                      <div className="text-3xl">{AI_PERSONALITIES[currentSpeaker].emoji}</div>
                      <div className="bg-slate-700/50 rounded-2xl p-4">
                        <div className="flex gap-1">
                          {[0, 150, 300].map((delay, i) => (
                            <div
                              key={i}
                              className="w-2 h-2 bg-purple-400 rounded-full"
                              style={{
                                animation: 'bounce 1s infinite',
                                animationDelay: `${delay}ms`
                              }}
                            />
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                  
                  <div ref={messagesEndRef} />
                </div>
              </div>

              {/* Input */}
              <div className="bg-slate-800/80 backdrop-blur-lg rounded-b-2xl p-4 border border-purple-500/30 border-t-0">
                <div className="flex gap-2 mb-3 flex-wrap">
                  {Object.keys(AI_PERSONALITIES).map(aiKey => {
                    const ai = AI_PERSONALITIES[aiKey];
                    return (
                      <button
                        key={aiKey}
                        onClick={() => getAIResponse(aiKey, messages[messages.length - 1]?.text || selectedTopic?.starter)}
                        disabled={isThinking}
                        className="px-3 py-1 rounded-lg transition text-sm disabled:opacity-50"
                        style={{
                          backgroundColor: `${ai.color}20`,
                          color: ai.color
                        }}
                      >
                        {ai.emoji} Invite {ai.name}
                      </button>
                    );
                  })}
                </div>

                <div className="flex gap-2">
                  <input
                    type="text"
                    value={inputMessage}
                    onChange={(e) => setInputMessage(e.target.value)}
                    onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                    placeholder="Your thoughts? Questions? Challenges? (You are Ticky 💛)"
                    className="flex-1 bg-slate-900/50 text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500"
                  />
                  <button
                    onClick={sendMessage}
                    disabled={!inputMessage.trim() || isThinking}
                    className="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg hover:from-purple-700 hover:to-pink-700 transition disabled:opacity-50 font-bold"
                  >
                    Send 💛
                  </button>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>
</html>
