<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Defs -->
  <defs>
    <marker id="arrowhead-controlling" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 14 5, 0 10" fill="#D35400"/>
    </marker>
  </defs>

  <!-- Outer circle (light reference) -->
  <circle cx="400" cy="420" r="260" fill="none" stroke="#E8E8E8" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Star pattern showing controlling cycle -->
  <path d="M 400 180 L 245 560 L 623 310 L 177 310 L 555 560 Z"
        fill="none" stroke="#D35400" stroke-width="3" opacity="0.15"/>

  <!-- Controlling relationship arrows (star pattern) -->

  <!-- Water → Fire -->
  <path d="M 240 290 Q 350 240 550 290"
        fill="none" stroke="#D35400" stroke-width="5" marker-end="url(#arrowhead-controlling)"/>

  <!-- Fire → Metal -->
  <path d="M 570 350 Q 420 480 310 540"
        fill="none" stroke="#D35400" stroke-width="5" marker-end="url(#arrowhead-controlling)"/>

  <!-- Metal → Wood -->
  <path d="M 310 540 Q 350 340 380 200"
        fill="none" stroke="#D35400" stroke-width="5" marker-end="url(#arrowhead-controlling)"/>

  <!-- Wood → Earth -->
  <path d="M 420 200 Q 480 390 500 540"
        fill="none" stroke="#D35400" stroke-width="5" marker-end="url(#arrowhead-controlling)"/>

  <!-- Earth → Water -->
  <path d="M 490 540 Q 320 390 230 350"
        fill="none" stroke="#D35400" stroke-width="5" marker-end="url(#arrowhead-controlling)"/>

  <!-- Element Circles — shifted down 40px to clear title -->

  <!-- Water (Top Left) -->
  <g id="water-element">
    <circle cx="200" cy="320" r="65" fill="#3498DB" opacity="0.9"/>
    <circle cx="200" cy="320" r="60" fill="none" stroke="white" stroke-width="2"/>
    <text x="200" y="302" font-size="36" text-anchor="middle" fill="white">💧</text>
    <text x="200" y="335" font-size="18" font-weight="bold" text-anchor="middle" fill="white">WATER</text>
    <text x="200" y="353" font-size="13" text-anchor="middle" fill="white">水</text>
  </g>

  <!-- Wood (Top) -->
  <g id="wood-element">
    <circle cx="400" cy="160" r="65" fill="#27AE60" opacity="0.9"/>
    <circle cx="400" cy="160" r="60" fill="none" stroke="white" stroke-width="2"/>
    <text x="400" y="142" font-size="36" text-anchor="middle" fill="white">🌳</text>
    <text x="400" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="white">WOOD</text>
    <text x="400" y="193" font-size="13" text-anchor="middle" fill="white">木</text>
  </g>

  <!-- Fire (Top Right) -->
  <g id="fire-element">
    <circle cx="600" cy="320" r="65" fill="#E74C3C" opacity="0.9"/>
    <circle cx="600" cy="320" r="60" fill="none" stroke="white" stroke-width="2"/>
    <text x="600" y="302" font-size="36" text-anchor="middle" fill="white">🔥</text>
    <text x="600" y="335" font-size="18" font-weight="bold" text-anchor="middle" fill="white">FIRE</text>
    <text x="600" y="353" font-size="13" text-anchor="middle" fill="white">火</text>
  </g>

  <!-- Earth (Bottom Right) -->
  <g id="earth-element">
    <circle cx="520" cy="570" r="65" fill="#D68910" opacity="0.9"/>
    <circle cx="520" cy="570" r="60" fill="none" stroke="white" stroke-width="2"/>
    <text x="520" y="552" font-size="36" text-anchor="middle" fill="white">🌍</text>
    <text x="520" y="585" font-size="18" font-weight="bold" text-anchor="middle" fill="white">EARTH</text>
    <text x="520" y="603" font-size="13" text-anchor="middle" fill="white">土</text>
  </g>

  <!-- Metal (Bottom Left) -->
  <g id="metal-element">
    <circle cx="280" cy="570" r="65" fill="#95A5A6" opacity="0.9"/>
    <circle cx="280" cy="570" r="60" fill="none" stroke="white" stroke-width="2"/>
    <text x="280" y="552" font-size="36" text-anchor="middle" fill="white">⚙️</text>
    <text x="280" y="585" font-size="18" font-weight="bold" text-anchor="middle" fill="white">METAL</text>
    <text x="280" y="603" font-size="13" text-anchor="middle" fill="white">金</text>
  </g>

  <!-- Relationship Labels (on top of circles) -->

  <!-- Water → Fire: Extinguishes -->
  <g>
    <rect x="330" y="238" width="140" height="38" rx="19" fill="white" stroke="#E67E22" stroke-width="2"/>
    <text x="400" y="257" font-size="13" font-weight="bold" text-anchor="middle" fill="#E67E22">Water controls</text>
    <text x="400" y="272" font-size="12" text-anchor="middle" fill="#E67E22">Fire (extinguishes)</text>
  </g>

  <!-- Fire → Metal: Melts -->
  <g>
    <rect x="470" y="408" width="110" height="38" rx="19" fill="white" stroke="#E67E22" stroke-width="2"/>
    <text x="525" y="427" font-size="13" font-weight="bold" text-anchor="middle" fill="#E67E22">Fire controls</text>
    <text x="525" y="442" font-size="12" text-anchor="middle" fill="#E67E22">Metal (melts)</text>
  </g>

  <!-- Metal → Wood: Chops -->
  <g>
    <rect x="250" y="330" width="110" height="38" rx="19" fill="white" stroke="#E67E22" stroke-width="2"/>
    <text x="305" y="349" font-size="13" font-weight="bold" text-anchor="middle" fill="#E67E22">Metal controls</text>
    <text x="305" y="364" font-size="12" text-anchor="middle" fill="#E67E22">Wood (chops)</text>
  </g>

  <!-- Wood → Earth: Penetrates -->
  <g>
    <rect x="460" y="330" width="120" height="38" rx="19" fill="white" stroke="#E67E22" stroke-width="2"/>
    <text x="520" y="349" font-size="13" font-weight="bold" text-anchor="middle" fill="#E67E22">Wood controls</text>
    <text x="520" y="364" font-size="12" text-anchor="middle" fill="#E67E22">Earth (penetrates)</text>
  </g>

  <!-- Earth → Water: Dams -->
  <g>
    <rect x="250" y="408" width="110" height="38" rx="19" fill="white" stroke="#E67E22" stroke-width="2"/>
    <text x="305" y="427" font-size="13" font-weight="bold" text-anchor="middle" fill="#E67E22">Earth controls</text>
    <text x="305" y="442" font-size="12" text-anchor="middle" fill="#E67E22">Water (dams)</text>
  </g>

  <!-- Center explanation (rendered last, on top) -->
  <g id="center-note">
    <circle cx="400" cy="420" r="80" fill="white" opacity="0.95" stroke="#E67E22" stroke-width="2"/>
    <text x="400" y="410" font-size="14" font-weight="bold" text-anchor="middle" fill="#E67E22">Star Pattern</text>
    <text x="400" y="430" font-size="12" text-anchor="middle" fill="#E67E22">Each element</text>
    <text x="400" y="447" font-size="12" text-anchor="middle" fill="#E67E22">controls another</text>
  </g>

  <!-- Title (rendered last so it's never covered) -->
  <text x="400" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    The Controlling Cycle (克 - Kè)
  </text>
  <text x="400" y="70" font-size="16" text-anchor="middle" fill="#7F8C8D">
    Regulation &amp; Balance - Each Element Controls Another
  </text>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="680" width="700" height="90" rx="10" fill="#FEF5E7" stroke="#E67E22" stroke-width="2"/>
    <text x="400" y="705" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      The Controlling Cycle: Regulation &amp; Healthy Challenge
    </text>
    <text x="60" y="730" font-size="13" fill="#34495E">
      • Your "Controller" element = Your medicine - need in small doses for balance
    </text>
    <text x="60" y="750" font-size="13" fill="#34495E">
      • Your "Controlled" element = You regulate them - they may resist your influence
    </text>
  </g>
</svg>